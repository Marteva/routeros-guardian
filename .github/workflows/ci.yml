name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # No -race: the race detector needs cgo and the project is CGO_ENABLED=0.
      - name: go test
        run: go test ./...

  build:
    name: Build ${{ matrix.platform }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/arm64
            arch: arm64
          - platform: linux/arm/v7
            arch: arm
          - platform: linux/amd64
            arch: amd64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Cross-compiles guardian + probe and assembles the RouterOS image
      # tarball with tools/mkimage (CA bundle skipped to stay offline).
      - name: Cross-build
        run: bash scripts/build.sh --arch "${{ matrix.arch }}" --version "ci-${GITHUB_SHA::7}" --no-ca-cert

  docker:
    name: Docker image (no push)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/arm/v7,linux/amd64
          build-args: VERSION=ci-${{ github.sha }}
          push: false
          provenance: false
          sbom: false
