name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  IMAGE: ghcr.io/marteva/routeros-guardian

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  tarballs:
    name: RouterOS tarballs + GitHub Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          # reproducible image timestamps (tools/mkimage honours SOURCE_DATE_EPOCH)
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Download CA bundle
        run: curl -fsSL --retry 3 -o tools/mkimage/cacert.pem https://curl.se/ca/cacert.pem

      - name: Build binaries and image tarballs
        run: |
          for arch in arm64 arm amd64; do
            bash scripts/build.sh --arch "$arch" --version "$VERSION" --ca-cert tools/mkimage/cacert.pem
          done
          cd dist
          sha256sum routeros-guardian-*.tar > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            $prerelease \
            dist/routeros-guardian-arm64.tar \
            dist/routeros-guardian-arm.tar \
            dist/routeros-guardian-amd64.tar \
            dist/SHA256SUMS.txt

  image:
    name: Multi-arch image -> GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # provenance/SBOM attestations are disabled so the registry serves a plain
      # multi-arch manifest list; container runtimes with limited OCI support
      # (such as RouterOS) may not handle attestation manifests.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64,linux/arm/v7,linux/amd64
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          provenance: false
          sbom: false
