name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation on your network and what is missing today.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? UI, alerts, settings, RouterOS side?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      description: Guardian runs on small routers - new features should respect that.
      options:
        - label: I checked the roadmap in the README and existing issues.
          required: true
        - label: I would be willing to help implement or test this.
          required: false
